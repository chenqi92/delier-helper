[package]
name = "deliver-helper"
version = "0.3.3"
description = "交付助手"
authors = ["chenqi"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deliver_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
walkdir = "2.5.0"
encoding_rs = "0.8.35"
glob = "0.3.3"
image = "0.25.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
futures = "0.3"
oracle = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"

